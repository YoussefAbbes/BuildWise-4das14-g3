# Ajouté par-dessus src/main/resources/application.properties quand le profil "test" est actif.
# Pas d'inscription dans Eureka pendant les tests (ni WireGuard ni Eureka nécessaires).
eureka.client.enabled=false
# Pas de création d'index au démarrage des tests (fiche evaluation).
spring.data.mongodb.auto-index-creation=false
# Tester le disjoncteur sans workforce (fiche evaluation) : rien n'écoute sur le port 1, l'appel échoue -> 503.
spring.cloud.discovery.client.simple.instances.workforce[0].uri=http://localhost:1
