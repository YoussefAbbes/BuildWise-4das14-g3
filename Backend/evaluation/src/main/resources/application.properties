spring.application.name=evaluation
server.port=8088
# --- Eureka : les deux serveurs, inscription avec l'adresse WireGuard ---
eureka.client.service-url.defaultZone=http://10.66.0.11:8761/eureka,http://10.66.0.2:8761/eureka
eureka.instance.prefer-ip-address=true
spring.cloud.inetutils.preferred-networks=10.66.0
eureka.instance.instance-id=${spring.application.name}:${server.port}
# un Eureka éteint : abandon après 3 s au lieu de 3 min (tests réels du 24/11)
eureka.client.timeout.connect-timeout=3000
eureka.client.timeout.connect-request-timeout=3000
eureka.client.timeout.socket-timeout=8000
# signe de vie toutes les 5 s ; une instance arrêtée disparaît en ~30 s au lieu de 3 min
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15
# evaluation appelle workforce : voir une instance nouvelle ou arrêtée en quelques secondes
eureka.client.registry-fetch-interval-seconds=5
spring.cloud.loadbalancer.cache.ttl=5s
# --- Actuator et Swagger ---
management.endpoints.web.exposure.include=health,info
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# --- MongoDB ---
spring.mongodb.uri=mongodb://localhost:27017/evaluation_db
# ids en UUID (sinon MongoDB refuse de les enregistrer) et moyenne BigDecimal en Decimal128
spring.mongodb.representation.uuid=standard
spring.data.mongodb.representation.big-decimal=decimal128
# crée l'index unique (workerId, taskId) déclaré par @CompoundIndex
spring.data.mongodb.auto-index-creation=true
# --- OpenFeign vers workforce ---
spring.cloud.openfeign.client.config.workforce.connect-timeout=2000
spring.cloud.openfeign.client.config.workforce.read-timeout=3000
spring.cloud.openfeign.circuitbreaker.enabled=true
# --- Resilience4j : disjoncteur et délai maximal ---
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.ignore-exceptions=feign.FeignException$NotFound
resilience4j.timelimiter.configs.default.timeout-duration=4s
# --- Cache Redis ---
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
# Pas encore de @Cacheable : /actuator/health reste UP même sans conteneur Redis
management.health.redis.enabled=false
