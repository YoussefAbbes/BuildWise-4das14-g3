spring.application.name=materials
server.port=8085

# --- Eureka : les deux serveurs, inscription avec l'adresse WireGuard ---
eureka.client.service-url.defaultZone=http://10.66.0.11:8761/eureka,http://10.66.0.2:8761/eureka
eureka.instance.prefer-ip-address=true
spring.cloud.inetutils.preferred-networks=10.66.0
eureka.instance.instance-id=${spring.application.name}:${server.port}
# un Eureka �teint : abandon apr�s 3 s au lieu de 3 min (tests r�els du 24/11)
eureka.client.timeout.connect-timeout=3000
eureka.client.timeout.connect-request-timeout=3000
eureka.client.timeout.socket-timeout=8000
# signe de vie toutes les 5 s ; une instance arr�t�e dispara�t en ~30 s au lieu de 3 min
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15

# --- Actuator et Swagger ---
management.endpoints.web.exposure.include=health,info
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- MongoDB en replica set � un n?ud (transactions) ---
spring.mongodb.uri=mongodb://localhost:27017/materials_db?replicaSet=rs0&directConnection=true
spring.data.mongodb.representation.big-decimal=decimal128
# les ids sont des UUID : sans cette ligne, MongoDB refuse de les enregistrer
spring.mongodb.representation.uuid=standard

# --- Cache Redis ---
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
# Pas encore de @Cacheable : /actuator/health reste UP m�me sans conteneur Redis
management.health.redis.enabled=false

# --- Floci (S3) : le bucket du service (cl�s : variables AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY = test) ---
buildwise.s3.endpoint=http://10.66.0.10:4566
buildwise.s3.bucket=bw-materials
buildwise.s3.region=us-east-1
buildwise.s3.path-style=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
